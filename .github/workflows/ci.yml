name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Queue main runs (never cancel a publish); cancel superseded PR runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 test --locked

  # Native runner per platform (no QEMU): arm64 compiles on ubuntu-24.04-arm.
  # PRs only build; on main each leg pushes by digest and `image` stitches the manifest list.
  docker:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, tag: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, tag: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
      - if: env.PUSH == 'true'
        run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.tag }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.tag }}
          path: digest-${{ matrix.tag }}

  image:
    if: github.ref == 'refs/heads/main'
    needs: [test, msrv, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools create -t "$IMAGE:latest" $(for f in digest-*; do echo "$IMAGE@$(cat "$f")"; done)
          docker buildx imagetools inspect "$IMAGE:latest"
