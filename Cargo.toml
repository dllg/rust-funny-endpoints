[package]
name = "funny-endpoints"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Funny text from open APIs on GET endpoints"
license = "MIT"

[dependencies]
axum = "0.8.9"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
